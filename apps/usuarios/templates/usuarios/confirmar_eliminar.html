<!-- usuarios/templates/usuarios/confirmar_eliminar.html -->
{% extends 'base.html' %}

{% block page_title %}Confirmar Eliminación{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="custom-card border-danger">
            <div class="card-header bg-danger text-white">
                <i class="fas fa-exclamation-triangle"></i> Confirmar Eliminación
            </div>
            <div class="card-body text-center">
                <i class="fas fa-user-times fa-4x text-danger mb-3"></i>
                
                <h4>¿Está seguro de eliminar el usuario?</h4>
                
                <div class="custom-card mt-3">
                    <div class="card-body">
                        <i class="fas fa-user text-danger me-2"></i>
                        <strong>{{ usuario.username }}</strong>
                        <p class="text-muted mb-0">Rol: {{ usuario.rol.nombre_rol }}</p>
                    </div>
                </div>
                
                <div class="alert alert-danger mt-3">
                    <i class="fas fa-exclamation-triangle"></i>
                    Esta acción no se puede deshacer.
                </div>
                
                <form method="post" class="mt-3">
                    {% csrf_token %}
                    <div class="d-flex gap-2 justify-content-center">
                        <button type="submit" class="btn btn-danger">
                            <i class="fas fa-trash"></i> Eliminar
                        </button>
                        <a href="{% url 'usuarios:lista_usuarios' %}" class="btn btn-secondary">
                            Cancelar
                        </a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
