<!-- trabajos/templates/trabajos/form_trabajo.html -->
{% extends 'base.html' %}

{% block title %}{% if trabajo %}Editar{% else %}Nuevo{% endif %} Trabajo{% endblock %}

{% block content %}
<div class="d-flex justify-content-between align-items-center mb-4">
    <h2><i class="fas fa-plus"></i> {% if trabajo %}Editar{% else %}Nuevo{% endif %} Trabajo</h2>
    <a href="{% url 'trabajos:lista_trabajos' %}" class="btn btn-secondary">
        <i class="fas fa-arrow-left"></i> Volver
    </a>
</div>

<div class="row">
    <div class="col-md-8">
        <div class="card">
            <div class="card-header">
                <h5 class="mb-0"><i class="fas fa-briefcase"></i> Datos del Trabajo</h5>
            </div>
            <div class="card-body">
                <form method="post">
                    {% csrf_token %}
                    
                    <div class="mb-3">
                        <label class="form-label">Propiedad *</label>
                        <select name="propiedad" class="form-select" required>
                            <option value="">Seleccione propiedad</option>
                            {% for p in propiedades %}
                            <option value="{{ p.id_propiedad }}" {% if trabajo.propiedad_id == p.id_propiedad %}selected{% endif %}>
                                {{ p.direccion }} - {{ p.cliente.nombre }}
                            </option>
                            {% endfor %}
                        </select>
                    </div>
                    
                    <div class="row">
                        <div class="col-md-6">
                            <div class="mb-3">
                                <label class="form-label">Fecha Inicio *</label>
                                <input type="date" name="fecha_inicio" class="form-control" 
                                       value="{{ trabajo.fecha_inicio|default:'' }}" required>
                            </div>
                        </div>
                        {% if trabajo %}
                        <div class="col-md-6">
                            <div class="mb-3">
                                <label class="form-label">Fecha Fin</label>
                                <input type="date" name="fecha_fin" class="form-control" 
                                       value="{{ trabajo.fecha
